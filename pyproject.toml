[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-radar"
version = "0.1.0"
description = "CLI: собирает вакансии с work.ua и DOU, хранит в SQLite и оценивает их под резюме через Claude"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "curl_cffi>=0.7",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pydantic>=2.6",
    "anthropic>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jobradar = "jobradar.cli:main"

[tool.setuptools.packages.find]
include = ["jobradar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
